[package]
name = "wg-target"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wg-target"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
clap_complete = { version = "4.6.12", features = ["unstable-dynamic"] }
color-eyre = "0.6.5"
confy = "2.0.0"
console = "0.16.6"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["serde"] }
